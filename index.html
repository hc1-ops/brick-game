<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>벽돌깨기</title>
<style>
  :root {
    --pink: #ff8fb8;
    --pink-dark: #ec6a9c;
    --text: #7a4d6e;
    --lemon: #ffd66b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    /* 파스텔 그라데이션 + 물방울 무늬 */
    background:
      radial-gradient(circle, rgba(255, 255, 255, 0.55) 3px, transparent 4px) 0 0 / 36px 36px,
      radial-gradient(circle, rgba(255, 255, 255, 0.35) 3px, transparent 4px) 18px 18px / 36px 36px,
      linear-gradient(160deg, #ffd6e8 0%, #e9dcff 50%, #cfe9ff 100%);
    color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 8px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  h1 {
    margin-bottom: clamp(6px, 2vh, 14px);
    font-size: clamp(18px, min(6vw, 6vh), 34px);
    letter-spacing: 2px;
    color: #ff6fa5;
    text-shadow:
      2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff,
      0 5px 0 rgba(236, 106, 156, 0.35);
  }
  /* --s: 게임 화면 배율 (JS가 화면 크기에 맞춰 설정) */
  #wrap { position: relative; --s: 1; }
  canvas {
    display: block;
    width: 640px;
    height: 480px;
    border: 5px solid #fff;
    border-radius: 24px;
    box-shadow: 0 10px 0 rgba(236, 106, 156, 0.25), 0 16px 40px rgba(180, 120, 200, 0.35);
    cursor: none;
    touch-action: none;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--s) * 16px);
    background: rgba(255, 240, 248, 0.45);
    border-radius: 24px;
    touch-action: none;
  }
  #overlay.hidden { display: none; }
  #message { font-size: calc(var(--s) * 60px); font-weight: bold; }
  #message:empty, #sub:empty, #scores:empty { display: none; }
  #message.over, #message.clear {
    text-shadow:
      3px 3px 0 #fff, -3px 3px 0 #fff, 3px -3px 0 #fff, -3px -3px 0 #fff,
      0 6px 0 rgba(122, 77, 110, 0.2);
  }
  #message.over { color: #ff6fa5; }
  #message.clear { color: #ffb52e; }
  #sub { font-size: calc(var(--s) * 20px); font-weight: bold; color: var(--text); }
  #scores { display: flex; gap: calc(var(--s) * 14px); }
  .scoreBox {
    min-width: calc(var(--s) * 130px);
    padding: calc(var(--s) * 10px) calc(var(--s) * 16px);
    border: 3px solid #ffc2da;
    border-radius: 18px;
    background: #fff;
    box-shadow: 0 4px 0 #ffc2da;
    text-align: center;
  }
  .scoreBox.best { border-color: #ffe08a; box-shadow: 0 4px 0 #ffe08a; }
  .scoreBox .label { font-size: calc(var(--s) * 14px); color: #b48aa8; font-weight: bold; }
  .scoreBox .value { font-size: calc(var(--s) * 30px); font-weight: bold; color: #ff6fa5; }
  .scoreBox.best .value { color: #ffb52e; }
  .newRecord {
    display: block;
    margin-top: 4px;
    font-size: calc(var(--s) * 13px);
    font-weight: bold;
    color: #ff6fa5;
    animation: bounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-4px); } }
  #startBtn {
    font-size: calc(var(--s) * 24px);
    font-family: inherit;
    font-weight: bold;
    padding: calc(var(--s) * 14px) calc(var(--s) * 46px);
    border: none;
    border-radius: 999px;
    background: var(--pink);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 var(--pink-dark), 0 10px 20px rgba(236, 106, 156, 0.35);
    transition: transform 0.1s, box-shadow 0.1s, background 0.15s;
  }
  #startBtn:hover { background: #ffa3c6; transform: translateY(-2px); }
  #startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--pink-dark); }
  #soundBtn {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 50px;
    height: 50px;
    font-size: 22px;
    border: 3px solid #ffc2da;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 4px 0 #ffc2da;
    z-index: 10;
  }
  #soundBtn:hover { transform: translateY(-2px); }
  #soundBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 #ffc2da; }
  #soundBtn.off { opacity: 0.6; filter: grayscale(0.6); }
  #help {
    margin-top: clamp(6px, 2vh, 14px);
    color: var(--text);
    font-size: clamp(11px, 3vw, 14px);
    text-align: center;
    line-height: 1.7;
  }
  .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; vertical-align: middle; }
  @media (max-width: 600px), (max-height: 500px) {
    #soundBtn { top: 8px; right: 8px; width: 40px; height: 40px; font-size: 18px; }
  }
</style>
</head>
<body>
  <button id="soundBtn" title="소리 켜기/끄기 (M)">🔊</button>
  <h1>🍓 말랑말랑 벽돌깨기 🍭</h1>
  <div id="wrap">
    <canvas id="game" width="640" height="480"></canvas>
    <div id="overlay">
      <div id="message"></div>
      <div id="sub"></div>
      <div id="scores"></div>
      <button id="startBtn">게임 시작</button>
    </div>
  </div>
  <p id="help">
    <span id="controls">← → 방향키 또는 마우스로 패들을 움직이세요 · M 키로 소리 켜기/끄기</span><br>
    <span class="dot" style="background:#7fdcb9"></span> 민트 사탕: 10초 동안 패들 길어짐 &nbsp;
    <span class="dot" style="background:#ffd66b"></span> 노란 사탕: 공 하나 추가
  </p>

<script>
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const overlay = document.getElementById("overlay");
  const message = document.getElementById("message");
  const sub = document.getElementById("sub");
  const startBtn = document.getElementById("startBtn");
  const soundBtn = document.getElementById("soundBtn");
  const scoresEl = document.getElementById("scores");
  const wrap = document.getElementById("wrap");

  // 게임 좌표계는 항상 640x480. 실제 표시 크기는 resize()가 맞춤
  const W = 640;
  const H = 480;
  let pixelScale = 1; // 논리 좌표 1 → 실제 캔버스 픽셀 수
  const FRAME = 1000 / 60; // 1 step = 60fps 기준 한 프레임

  // 벽돌 설정: 5줄 x 8칸
  const ROWS = 5;
  const COLS = 8;
  const BRICK_GAP = 8;
  const BRICK_TOP = 52;
  const BRICK_SIDE = 22;
  const BRICK_H = 20;
  const BRICK_W = (W - BRICK_SIDE * 2 - BRICK_GAP * (COLS - 1)) / COLS;
  const ROW_COLORS = ["#ffaecb", "#ffc9a3", "#ffe78f", "#b5ecc9", "#b3dbff"];

  // 패들과 공
  const PADDLE_W = 100;
  const PADDLE_W_WIDE = 160;
  const PADDLE_H = 16;
  const PADDLE_SPEED = 8;
  const BALL_R = 8;
  const BASE_SPEED = 5;
  const SPEED_PER_LEVEL = 0.6;
  const MAX_SPEED = 11;

  // 점수 / 목숨 / 아이템
  const BRICK_SCORE = 10;
  const START_LIVES = 3;
  const ITEM_CHANCE = 0.1;
  const ITEM_SIZE = 14;
  const ITEM_FALL = 2.5;
  const WIDE_TIME = 10000; // ms
  const ITEM_TYPES = {
    wide:  { color: "#7fdcb9", label: "↔" },
    multi: { color: "#ffd66b", label: "+" },
  };

  // 화면 가운데 문구 색
  const LEVEL_COLOR = "#9b7bd6";
  const CLEAR_COLOR = "#ffb52e";
  const LOSE_COLOR = "#7fa8ff";

  const SERVE_DELAY = 1200;   // 공이 패들 위에서 대기하는 시간
  const LEVEL_PAUSE = 1800;   // 레벨 클리어 문구 표시 시간

  let paddle, balls, bricks, items, score, lives, level;
  let particles = [];
  let wideLeft = 0;           // 패들 확장 남은 시간(ms)
  let serveLeft = 0;          // 공 발사까지 남은 시간(ms)
  let banner = null;          // { text, color, left }
  let running = false;
  const keys = { left: false, right: false };

  // ───────── 효과음 (Web Audio) ─────────
  let audioCtx = null;
  let muted = false;
  try { muted = localStorage.getItem("brick-muted") === "1"; } catch (e) {}

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  // freq에서 시작해 slide까지 미끄러지는 짧은 소리
  function tone(freq, dur, { type = "square", vol = 0.12, slide = null, delay = 0 } = {}) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // 부드러운 sine/triangle 위주로 "뿅", "퐁" 같은 귀여운 소리
  const sfx = {
    wall:   () => tone(700, 0.05, { type: "sine", vol: 0.15 }),
    paddle: () => tone(480, 0.12, { type: "sine", vol: 0.2, slide: 900 }),
    brick:  (row) => {
      const f = 900 - row * 90; // 위쪽 줄일수록 높은 소리
      tone(f, 0.09, { type: "sine", vol: 0.18, slide: f * 1.8 }); // 거품 터지는 "퐁"
      tone(f * 2, 0.05, { type: "triangle", vol: 0.05, delay: 0.03 });
    },
    item:   () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.1, { type: "sine", vol: 0.16, delay: i * 0.06 })),
    lose:   () => tone(700, 0.4, { type: "triangle", vol: 0.16, slide: 260 }),
    clear:  () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.14, { type: "triangle", vol: 0.15, delay: i * 0.09 })),
    gameOver: () => {
      // "뿌-뿌-뿌-뿌우~"
      [392, 370, 349].forEach((f, i) => tone(f, 0.28, { type: "triangle", vol: 0.16, delay: i * 0.3 }));
      tone(330, 0.9, { type: "triangle", vol: 0.16, slide: 220, delay: 0.9 });
    },
  };

  function updateSoundBtn() {
    soundBtn.textContent = muted ? "🔇" : "🔊";
    soundBtn.classList.toggle("off", muted);
  }

  function toggleSound() {
    muted = !muted;
    try { localStorage.setItem("brick-muted", muted ? "1" : "0"); } catch (e) {}
    updateSoundBtn();
    if (!muted) { ensureAudio(); tone(880, 0.08, { type: "triangle" }); }
  }

  // ───────── 최고 점수 (브라우저에 저장) ─────────
  const BEST_KEY = "brick-best-score";
  let bestScore = 0;
  try { bestScore = parseInt(localStorage.getItem(BEST_KEY), 10) || 0; } catch (e) {}

  function saveBest() {
    try { localStorage.setItem(BEST_KEY, String(bestScore)); } catch (e) {}
  }

  function scoreBox(label, value, best, isNew) {
    return `<div class="scoreBox${best ? " best" : ""}">
      <div class="label">${label}</div>
      <div class="value">${value}</div>
      ${isNew ? '<span class="newRecord">🎉 새 기록!</span>' : ""}
    </div>`;
  }

  function showStartScores() {
    scoresEl.innerHTML = bestScore > 0 ? scoreBox("최고 점수", bestScore, true, false) : "";
  }

  // ───────── 화면 크기 맞추기 ─────────
  const h1 = document.querySelector("h1");
  const help = document.getElementById("help");

  function resize() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const outer = (el) => {
      const cs = getComputedStyle(el);
      return el.offsetHeight + parseFloat(cs.marginTop) + parseFloat(cs.marginBottom);
    };
    const availW = vw - 16; // body padding
    const availH = vh - 16 - outer(h1) - outer(help);
    // 너무 작아지지 않게 최소 0.4배, 큰 화면에서는 최대 1.5배
    const s = Math.max(0.4, Math.min(availW / W, availH / H, 1.5));
    const cssW = Math.floor(W * s);
    const cssH = Math.floor(H * s);

    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    wrap.style.setProperty("--s", s.toFixed(3));

    // 레티나 등 고해상도 화면에서도 선명하게
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    pixelScale = canvas.width / W;
    ctx.setTransform(pixelScale, 0, 0, pixelScale, 0, 0);
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));

  // ───────── 파스텔 하늘 배경 ─────────
  const bgCanvas = document.createElement("canvas");
  bgCanvas.width = W;
  bgCanvas.height = H;
  (function paintSky() {
    const g = bgCanvas.getContext("2d");
    const grad = g.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#ffe4f1");
    grad.addColorStop(0.55, "#f1e6ff");
    grad.addColorStop(1, "#dcefff");
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    // 은은한 물방울 무늬
    g.fillStyle = "rgba(255, 255, 255, 0.45)";
    for (let y = 12; y < H; y += 32) {
      for (let x = (y / 32) % 2 ? 28 : 12; x < W; x += 32) {
        g.beginPath();
        g.arc(x, y, 2.5, 0, Math.PI * 2);
        g.fill();
      }
    }
  })();

  // 천천히 흘러가는 구름
  const clouds = Array.from({ length: 4 }, (_, i) => ({
    x: Math.random() * W,
    y: 150 + i * 70 + Math.random() * 30,
    scale: 0.6 + Math.random() * 0.6,
    speed: 0.1 + Math.random() * 0.15,
  }));

  // 둥실둥실 떠오르는 하트·별·동그라미
  const FLOAT_COLORS = ["#ffb3cf", "#ffd6a5", "#fff1a8", "#c3f0d9", "#c2e2ff", "#dccbff"];
  const floaties = Array.from({ length: 22 }, () => newFloaty(Math.random() * H));

  function newFloaty(y) {
    return {
      x: Math.random() * W,
      y,
      size: Math.random() * 6 + 5,
      speed: Math.random() * 0.25 + 0.1,
      sway: Math.random() * Math.PI * 2,
      shape: ["heart", "star", "circle"][Math.floor(Math.random() * 3)],
      color: FLOAT_COLORS[Math.floor(Math.random() * FLOAT_COLORS.length)],
    };
  }

  function updateDecor(step) {
    for (const c of clouds) {
      c.x += c.speed * step;
      if (c.x - 80 * c.scale > W) c.x = -80 * c.scale;
    }
    for (let i = 0; i < floaties.length; i++) {
      const f = floaties[i];
      f.y -= f.speed * step;
      f.sway += 0.03 * step;
      if (f.y < -15) floaties[i] = newFloaty(H + 15);
    }
  }

  // ───────── 벽돌이 깨질 때 튀는 하트·별 조각 ─────────
  function burst(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const v = Math.random() * 3 + 1;
      particles.push({
        x: x + (Math.random() - 0.5) * BRICK_W * 0.6,
        y: y + (Math.random() - 0.5) * BRICK_H * 0.5,
        dx: Math.cos(a) * v,
        dy: Math.sin(a) * v - 1.8,
        size: Math.random() * 5 + 5,
        spin: Math.random() * Math.PI,
        life: 1,
        decay: Math.random() * 0.015 + 0.018,
        shape: ["heart", "star", "circle"][i % 3],
        color: i % 4 === 0 ? "#ffffff" : color,
      });
    }
  }

  function updateParticles(step) {
    for (const p of particles) {
      p.x += p.dx * step;
      p.y += p.dy * step;
      p.dy += 0.1 * step;  // 중력
      p.dx *= Math.pow(0.98, step);
      p.spin += 0.12 * step;
      p.life -= p.decay * step;
    }
    particles = particles.filter((p) => p.life > 0 && p.y < H + 10);
  }
  // ───────── 게임 진행 ─────────
  function ballSpeed() {
    return Math.min(BASE_SPEED + (level - 1) * SPEED_PER_LEVEL, MAX_SPEED);
  }

  function buildBricks() {
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        bricks.push({
          x: BRICK_SIDE + c * (BRICK_W + BRICK_GAP),
          y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
          row: r,
          color: ROW_COLORS[r],
          alive: true,
          blinkOffset: Math.random() * 3600, // 벽돌마다 다른 때 눈 깜빡임
        });
      }
    }
  }

  // 공 하나를 패들 위에 올려놓고 잠시 뒤 발사
  function serveBall() {
    balls = [{ x: 0, y: 0, dx: 0, dy: 0, stuck: true }];
    items = [];
    wideLeft = 0;
    paddle.w = PADDLE_W;
    serveLeft = SERVE_DELAY;
    stickBall(balls[0]);
  }

  function stickBall(b) {
    b.x = paddle.x + paddle.w / 2;
    b.y = paddle.y - BALL_R - 1;
  }

  function launch(b) {
    const angle = (Math.random() * 60 - 30) * Math.PI / 180; // 위쪽 -30°~30°
    b.dx = ballSpeed() * Math.sin(angle);
    b.dy = -ballSpeed() * Math.cos(angle);
    b.stuck = false;
  }

  function newGame() {
    score = 0;
    lives = START_LIVES;
    level = 1;
    particles = [];
    paddle = { x: (W - PADDLE_W) / 2, y: H - 30, w: PADDLE_W };
    buildBricks();
    serveBall();
    banner = { text: "레벨 1", color: LEVEL_COLOR, left: SERVE_DELAY };
  }

  function startGame() {
    ensureAudio(); // 브라우저 정책상 사용자 클릭 시점에 오디오를 켜야 함
    newGame();
    overlay.classList.add("hidden");
    running = true;
  }

  function gameOver() {
    running = false;
    banner = null;
    sfx.gameOver();
    const isNew = score > bestScore;
    if (isNew) {
      bestScore = score;
      saveBest();
    }
    message.textContent = "게임 오버";
    message.className = "over";
    sub.textContent = `레벨 ${level}까지 도달`;
    scoresEl.innerHTML =
      scoreBox("이번 점수", score, false, false) +
      scoreBox("최고 점수", bestScore, true, isNew);
    startBtn.textContent = "다시 시작";
    overlay.classList.remove("hidden");
  }

  function levelClear() {
    sfx.clear();
    banner = { text: "클리어!", color: CLEAR_COLOR, left: LEVEL_PAUSE, next: true };
    balls = [];
    items = [];
  }

  function nextLevel() {
    level++;
    buildBricks();
    serveBall();
    banner = { text: `레벨 ${level}`, color: LEVEL_COLOR, left: SERVE_DELAY };
  }

  // 입력 처리
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") { keys.left = true; e.preventDefault(); }
    if (e.key === "ArrowRight") { keys.right = true; e.preventDefault(); }
    if (e.key === "m" || e.key === "M") toggleSound();
  });
  document.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
  });
  canvas.addEventListener("mousemove", (e) => {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    paddle.x = mx - paddle.w / 2;
    clampPaddle();
  });
  // 터치: 화면 어디든 손가락을 좌우로 끌면 패들이 같은 만큼 움직임
  let touchX = null;
  function onTouchStart(e) {
    if (!running || e.target.closest("button")) return;
    touchX = e.touches[0].clientX;
    e.preventDefault();
  }
  function onTouchMove(e) {
    if (!running || touchX === null) return;
    const x = e.touches[0].clientX;
    const rect = canvas.getBoundingClientRect();
    paddle.x += (x - touchX) * (W / rect.width);
    clampPaddle();
    touchX = x;
    e.preventDefault(); // 화면 스크롤/당겨서 새로고침 막기
  }
  function onTouchEnd(e) {
    if (e.touches.length === 0) touchX = null;
    else touchX = e.touches[0].clientX;
  }
  document.addEventListener("touchstart", onTouchStart, { passive: false });
  document.addEventListener("touchmove", onTouchMove, { passive: false });
  document.addEventListener("touchend", onTouchEnd);
  document.addEventListener("touchcancel", onTouchEnd);

  // 휴대폰이면 조작 안내 문구 바꾸기
  if (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) {
    document.getElementById("controls").textContent = "화면을 손가락으로 좌우로 끌어 패들을 움직이세요";
  }

  startBtn.addEventListener("click", startGame);
  soundBtn.addEventListener("click", (e) => {
    toggleSound();
    soundBtn.blur(); // 스페이스/엔터로 다시 눌리지 않게
  });

  function clampPaddle() {
    paddle.x = Math.max(0, Math.min(W - paddle.w, paddle.x));
  }

  function setPaddleWidth(w) {
    const center = paddle.x + paddle.w / 2;
    paddle.w = w;
    paddle.x = center - w / 2;
    clampPaddle();
  }

  function applyItem(type) {
    sfx.item();
    if (type === "wide") {
      if (wideLeft <= 0) setPaddleWidth(PADDLE_W_WIDE);
      wideLeft = WIDE_TIME; // 이미 길어진 상태면 시간만 다시 채움
    } else if (type === "multi") {
      const src = balls.find((b) => !b.stuck);
      const speed = ballSpeed();
      if (src) {
        // 기존 공 위치에서 좌우 반대 방향으로 하나 더
        const dx = -src.dx || speed * 0.5;
        balls.push({ x: src.x, y: src.y, dx, dy: -Math.abs(src.dy), stuck: false });
      } else {
        const b = { x: 0, y: 0, dx: 0, dy: 0 };
        stickBall(b);
        launch(b);
        balls.push(b);
      }
    }
  }

  function updateBall(b, step) {
    // 지나온 자리를 기억해서 꼬리를 그림
    b.trail = b.trail || [];
    b.trailTick = (b.trailTick || 0) + step;
    if (b.trailTick >= 1) {
      b.trailTick = 0;
      b.trail.push({ x: b.x, y: b.y });
      if (b.trail.length > 6) b.trail.shift();
    }

    b.x += b.dx * step;
    b.y += b.dy * step;

    // 벽 충돌
    if (b.x - BALL_R < 0) { b.x = BALL_R; b.dx = Math.abs(b.dx); sfx.wall(); }
    if (b.x + BALL_R > W) { b.x = W - BALL_R; b.dx = -Math.abs(b.dx); sfx.wall(); }
    if (b.y - BALL_R < 0) { b.y = BALL_R; b.dy = Math.abs(b.dy); sfx.wall(); }

    // 패들 충돌: 맞은 위치에 따라 반사 각도 변경
    if (
      b.dy > 0 &&
      b.y + BALL_R >= paddle.y &&
      b.y + BALL_R <= paddle.y + PADDLE_H + b.dy &&
      b.x >= paddle.x - BALL_R &&
      b.x <= paddle.x + paddle.w + BALL_R
    ) {
      const hit = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2); // -1 ~ 1
      const angle = Math.max(-1, Math.min(1, hit)) * 60 * Math.PI / 180;
      const speed = Math.hypot(b.dx, b.dy);
      b.dx = speed * Math.sin(angle);
      b.dy = -speed * Math.cos(angle);
      b.y = paddle.y - BALL_R;
      sfx.paddle();
    }

    // 벽돌 충돌 (한 번에 하나만)
    for (const br of bricks) {
      if (!br.alive) continue;
      const nearestX = Math.max(br.x, Math.min(b.x, br.x + BRICK_W));
      const nearestY = Math.max(br.y, Math.min(b.y, br.y + BRICK_H));
      const distX = b.x - nearestX;
      const distY = b.y - nearestY;
      if (distX * distX + distY * distY <= BALL_R * BALL_R) {
        br.alive = false;
        score += BRICK_SCORE;
        sfx.brick(br.row);
        burst(br.x + BRICK_W / 2, br.y + BRICK_H / 2, br.color);
        if (Math.random() < ITEM_CHANCE) {
          items.push({
            x: br.x + BRICK_W / 2,
            y: br.y + BRICK_H / 2,
            type: Math.random() < 0.5 ? "wide" : "multi",
          });
        }
        // 겹친 정도가 작은 축으로 반사
        const overlapX = BALL_R - Math.abs(distX);
        const overlapY = BALL_R - Math.abs(distY);
        if (distX !== 0 && (distY === 0 || overlapX < overlapY)) {
          b.dx = Math.sign(distX) * Math.abs(b.dx);
        } else {
          b.dy = (distY !== 0 ? Math.sign(distY) : -Math.sign(b.dy)) * Math.abs(b.dy);
        }
        break;
      }
    }
  }

  function update(step) {
    const ms = step * FRAME;

    // 배너(레벨 표시 / 클리어 문구)
    if (banner) {
      banner.left -= ms;
      if (banner.left <= 0) {
        const goNext = banner.next;
        banner = null;
        if (goNext) { nextLevel(); return; }
      }
    }
    if (banner && banner.next) return; // 클리어 문구 동안은 멈춤

    // 패들 이동 (키보드)
    if (keys.left) paddle.x -= PADDLE_SPEED * step;
    if (keys.right) paddle.x += PADDLE_SPEED * step;
    clampPaddle();

    // 패들 확장 시간
    if (wideLeft > 0) {
      wideLeft -= ms;
      if (wideLeft <= 0) { wideLeft = 0; setPaddleWidth(PADDLE_W); }
    }

    // 공 발사 대기
    if (serveLeft > 0) {
      serveLeft -= ms;
      if (serveLeft <= 0) balls.forEach((b) => b.stuck && launch(b));
    }

    for (const b of balls) {
      if (b.stuck) stickBall(b);
      else updateBall(b, step);
    }

    // 아이템 낙하 / 획득
    for (const it of items) {
      it.y += ITEM_FALL * step;
      if (
        it.y + ITEM_SIZE / 2 >= paddle.y &&
        it.y - ITEM_SIZE / 2 <= paddle.y + PADDLE_H &&
        it.x + ITEM_SIZE >= paddle.x &&
        it.x - ITEM_SIZE <= paddle.x + paddle.w
      ) {
        it.taken = true;
        applyItem(it.type);
      }
    }
    items = items.filter((it) => !it.taken && it.y - ITEM_SIZE < H);

    // 화면 아래로 떨어진 공 제거
    balls = balls.filter((b) => b.y - BALL_R <= H);

    // 클리어 판정
    if (bricks.every((br) => !br.alive)) {
      levelClear();
      return;
    }

    // 공을 모두 놓치면 목숨 -1
    if (balls.length === 0) {
      lives--;
      if (lives <= 0) {
        gameOver();
      } else {
        sfx.lose();
        serveBall();
        banner = { text: "목숨 -1", color: LOSE_COLOR, left: SERVE_DELAY };
      }
    }
  }

  // ───────── 그리기 ─────────
  const FACE = "#6b4a64";
  const BLUSH = "rgba(255, 120, 160, 0.45)";
  let clock = 0; // 눈 깜빡임 등 애니메이션용 시간(ms)

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // 색을 조금 어둡게 (#rrggbb → 테두리/그림자용)
  function shade(hex, k) {
    const n = parseInt(hex.slice(1), 16);
    const r = Math.round(((n >> 16) & 255) * k);
    const g = Math.round(((n >> 8) & 255) * k);
    const b = Math.round((n & 255) * k);
    return `rgb(${r},${g},${b})`;
  }

  function heartPath(cx, cy, size) {
    const s = size / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.9);
    ctx.bezierCurveTo(cx - s * 1.6, cy - s * 0.2, cx - s * 0.6, cy - s * 1.3, cx, cy - s * 0.45);
    ctx.bezierCurveTo(cx + s * 0.6, cy - s * 1.3, cx + s * 1.6, cy - s * 0.2, cx, cy + s * 0.9);
    ctx.closePath();
  }

  function starPath(cx, cy, size) {
    const outer = size / 2;
    const inner = outer * 0.5;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? inner : outer;
      const a = -Math.PI / 2 + (i * Math.PI) / 5;
      ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function shapePath(shape, x, y, size) {
    if (shape === "heart") heartPath(x, y, size);
    else if (shape === "star") starPath(x, y, size);
    else { ctx.beginPath(); ctx.arc(x, y, size / 2.6, 0, Math.PI * 2); }
  }

  // 귀여운 얼굴: 눈 두 개 + 웃는 입 + 볼터치
  function drawFace(cx, cy, scale, blink, mood = "smile") {
    const eyeGap = 7 * scale;
    ctx.fillStyle = FACE;
    ctx.strokeStyle = FACE;
    ctx.lineWidth = 1.6 * scale;
    ctx.lineCap = "round";
    for (const sx of [-1, 1]) {
      const ex = cx + sx * eyeGap;
      const ey = cy - 1.5 * scale;
      if (blink) {
        ctx.beginPath();
        ctx.moveTo(ex - 2 * scale, ey);
        ctx.lineTo(ex + 2 * scale, ey);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(ex, ey, 2 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(ex + 0.7 * scale, ey - 0.7 * scale, 0.7 * scale, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = FACE;
      }
    }
    ctx.beginPath();
    if (mood === "o") ctx.arc(cx, cy + 3 * scale, 1.8 * scale, 0, Math.PI * 2);
    else ctx.arc(cx, cy + 1.5 * scale, 2.6 * scale, 0.15 * Math.PI, 0.85 * Math.PI);
    mood === "o" ? ctx.fill() : ctx.stroke();
    ctx.fillStyle = BLUSH;
    for (const sx of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(cx + sx * 12 * scale, cy + 2.5 * scale, 3 * scale, 2 * scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHeart(cx, cy, size, filled) {
    heartPath(cx, cy, size);
    if (filled) {
      ctx.fillStyle = "#ff7fae";
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      ctx.beginPath();
      ctx.ellipse(cx - size * 0.2, cy - size * 0.12, size * 0.1, size * 0.07, -0.6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.fill();
      ctx.strokeStyle = "#e7c6dc";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // 흰 테두리가 있는 글자
  function outlinedText(text, x, y, color, size) {
    ctx.font = `bold ${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(4, size / 6);
    ctx.strokeStyle = "#fff";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 26 * s, y - 12 * s, 26 * s, 0, Math.PI * 2);
    ctx.arc(x + 56 * s, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 28 * s, y + 8 * s, 22 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawBackground() {
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    for (const c of clouds) drawCloud(c.x, c.y, c.scale);
    for (const f of floaties) {
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = f.color;
      shapePath(f.shape, f.x + Math.sin(f.sway) * 8, f.y, f.size);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function draw() {
    drawBackground();

    // 벽돌: 말랑한 젤리 + 얼굴 (가끔 눈을 깜빡임)
    for (const b of bricks) {
      if (!b.alive) continue;
      // 아래쪽 그림자 (말랑한 입체감)
      roundRect(b.x, b.y + 3, BRICK_W, BRICK_H, 9);
      ctx.fillStyle = shade(b.color, 0.85);
      ctx.fill();
      roundRect(b.x, b.y, BRICK_W, BRICK_H, 9);
      ctx.fillStyle = b.color;
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
      // 윗부분 반짝이
      ctx.fillStyle = "rgba(255,255,255,0.55)";
      roundRect(b.x + 6, b.y + 3, BRICK_W * 0.35, 4, 2);
      ctx.fill();
      const blink = (clock + b.blinkOffset) % 3600 < 140;
      drawFace(b.x + BRICK_W / 2, b.y + BRICK_H / 2 + 1, 0.95, blink);
    }

    // 하트·별 조각
    for (const p of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      shapePath(p.shape, 0, 0, p.size);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    }

    // 아이템: 사탕 모양
    for (const it of items) {
      const t = ITEM_TYPES[it.type];
      const r = ITEM_SIZE * 0.75;
      const wob = Math.sin(clock / 150 + it.x) * 0.2;
      ctx.save();
      ctx.translate(it.x, it.y);
      ctx.rotate(wob);
      ctx.fillStyle = shade(t.color, 0.9);
      for (const sx of [-1, 1]) {
        ctx.beginPath();
        ctx.moveTo(sx * r * 0.8, 0);
        ctx.lineTo(sx * (r + 9), -7);
        ctx.lineTo(sx * (r + 9), 7);
        ctx.closePath();
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fillStyle = t.color;
      ctx.fill();
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(t.label, 0, 1);
      ctx.textBaseline = "alphabetic";
      ctx.restore();
    }

    // 패들: 웃는 얼굴 (길어지면 민트색 + 남은 시간 막대)
    const pc = wideLeft > 0 ? "#8fe3c8" : "#ff9ec4";
    roundRect(paddle.x, paddle.y + 3, paddle.w, PADDLE_H, PADDLE_H / 2);
    ctx.fillStyle = shade(pc, 0.82);
    ctx.fill();
    roundRect(paddle.x, paddle.y, paddle.w, PADDLE_H, PADDLE_H / 2);
    ctx.fillStyle = pc;
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    roundRect(paddle.x + 10, paddle.y + 3, paddle.w * 0.3, 3, 1.5);
    ctx.fill();
    const paddleBlink = clock % 4200 < 150;
    drawFace(paddle.x + paddle.w / 2, paddle.y + PADDLE_H / 2 + 1, 0.85, paddleBlink, banner && banner.color === LOSE_COLOR ? "o" : "smile");
    if (wideLeft > 0) {
      ctx.fillStyle = "#5fcfa9";
      roundRect(paddle.x, paddle.y + PADDLE_H + 6, Math.max(3, paddle.w * (wideLeft / WIDE_TIME)), 4, 2);
      ctx.fill();
    }

    // 공: 꼬리 + 동글동글 반짝이는 공
    for (const b of balls) {
      if (b.trail) {
        b.trail.forEach((t, i) => {
          ctx.globalAlpha = (i + 1) / (b.trail.length + 1) * 0.35;
          ctx.fillStyle = "#ff9ec4";
          ctx.beginPath();
          ctx.arc(t.x, t.y, BALL_R * (0.4 + 0.6 * (i + 1) / b.trail.length), 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = "#fffaf0";
      ctx.fill();
      ctx.strokeStyle = "#ff8fb8";
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(b.x - BALL_R * 0.35, b.y - BALL_R * 0.35, BALL_R * 0.3, 0, Math.PI * 2);
      ctx.fill();
    }

    // 상단 정보: 점수 / 레벨 / 목숨
    ctx.textAlign = "left";
    outlinedText("점수 " + score, 14, 31, "#ff6fa5", 18);
    ctx.textAlign = "center";
    outlinedText("레벨 " + level, W / 2, 31, "#9b7bd6", 18);
    for (let i = 0; i < START_LIVES; i++) {
      drawHeart(W - 26 - i * 28, 24, 22, i < lives);
    }

    // 배너 (살짝 통통 튀는 글자)
    if (banner) {
      ctx.textAlign = "center";
      const bob = Math.sin(clock / 120) * 4;
      outlinedText(banner.text, W / 2, H / 2 + 60 + bob, banner.color, 52);
    }
  }

  // 배경 구름·하트와 조각은 게임 오버/시작 화면에서도 계속 움직임
  let lastTime = performance.now();
  function loop(now) {
    const step = Math.min((now - lastTime) / FRAME, 3);
    lastTime = now;
    // 빠른 공이 벽돌을 통과하지 않도록 잘게 나눠 업데이트
    const n = Math.ceil(step * 2);
    for (let i = 0; i < n; i++) {
      if (running) update(step / n);
      updateParticles(step / n);
    }
    updateDecor(step);
    clock += step * FRAME;
    draw();
    requestAnimationFrame(loop);
  }

  // 첫 화면: 게임판 미리보기 + 시작 버튼
  updateSoundBtn();
  showStartScores();
  resize();
  newGame();
  banner = null;
  requestAnimationFrame(loop);
</script>
</body>
</html>
